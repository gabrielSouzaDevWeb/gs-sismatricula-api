include:
  - template: Security/Secret-Detection.gitlab-ci.yml

stages:
  - secret-detection
  - build
  - deploy

variables:
  SECRET_DETECTION_ENABLED: 'true'

secret_detection:
  stage: secret-detection

build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA .
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA
  only:
    - main

deploy-to-caprover:
  stage: deploy
  image: caprover/cli-caprover:latest

  script:
    - echo "Deploy automático para CapRover iniciado..."
    - caprover deploy \
      -h $CAPROVER_URL \
      -p $CAPROVER_PASSWORD \
      -a $CAPROVER_APP \
      -i $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA

  only:
    - main
